name: 微信读书自动阅读

on:
  schedule:
    # GitHub cron 使用 UTC 时间（北京时间 = UTC + 8）。
    # 每小时整点运行一次，每次约 10 分钟（18 次 × 约 33 秒），全天 24 小时接力。
    - cron: "0 * * * *"
  workflow_dispatch: # 支持在 Actions 页面手动触发

# 同一时间只允许一次运行；上一窗口未结束时新触发的运行排队等待，
# 而不是直接取消，避免丢失阅读进度
concurrency:
  group: weread-reader
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    # 限制单次运行时长；10 分钟阅读 + 环境启动缓冲
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      # 采集榜单书库（供随机书阅读使用；失败不影响主书阅读）
      - name: 采集榜单书库
        env:
          WXREAD_CURL_BASH: ${{ secrets.WXREAD_CURL_BASH }}
          HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
        run: |
          python v2/collector.py --ranks rising,all,hot_search,newbook --top 5 --chapters || echo "采集失败（跳过随机书）"

      # 主账号必填，备用账号可选：配置了 WXREAD_CURL_BASH_BACKUP 则两个账号并行，否则仅主账号
      - name: 运行阅读脚本
        env:
          WXREAD_CURL_BASH: ${{ secrets.WXREAD_CURL_BASH }}
          WXREAD_CURL_BASH_BACKUP: ${{ secrets.WXREAD_CURL_BASH_BACKUP }}
          HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
          HTTP_PROXY_BACKUP: ${{ secrets.HTTP_PROXY_BACKUP }}
          SERVERCHAN_SPT: ${{ secrets.SERVERCHAN_SPT }}
          READ_NUM: ${{ vars.READ_NUM || 18 }}
          BOOK_ID: ${{ vars.BOOK_ID || 'ce032b305a9bc1ce0b0dd2a' }}
          RANDOM_BOOKS: ${{ vars.RANDOM_BOOKS || 10 }}
          RANDOM_BOOK_READS: ${{ vars.RANDOM_BOOK_READS || 3 }}
        run: |
          set -e
          pids=""

          run_account() {
            local curl_val="$1" proxy_val="$2" account_id="$3"
            if [ -z "$curl_val" ]; then
              echo "跳过账号 [$account_id]（未配置凭证）"
              return 0
            fi
            echo "启动账号 [$account_id]"
            WXREAD_CURL_BASH="$curl_val" HTTP_PROXY="$proxy_val" ACCOUNT_ID="$account_id" python main.py &
            pids="$pids $!"
          }

          run_account "$WXREAD_CURL_BASH" "$HTTP_PROXY" "主账号"
          run_account "$WXREAD_CURL_BASH_BACKUP" "$HTTP_PROXY_BACKUP" "备用"

          # 等待所有并行账号完成；任一失败则退出非 0，标记运行失败
          status=0
          for pid in $pids; do
            wait "$pid" || status=1
          done
          exit $status
